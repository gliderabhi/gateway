server:
  port: 8080

spring:
  application:
    name: gateway
  codec:
    # Raised from 25MB so video uploads aren't truncated
    max-in-memory-size: 2GB
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:3010"
              - "http://localhost:4200"
              - "http://localhost:4201"
              - "http://localhost:4202"
              - "http://localhost:4203"
              - "http://localhost:4204"
              - "http://localhost:4206"
              - "http://localhost:4207"
              - "http://32.194.147.195"
              - "https://*.trycloudflare.com"
              - "https://sevis.store"
              - "https://*.sevis.store"
              - "https://at.sevis.store"
              - "http://at.sevis.store"
              - "https://api.sevis.store"
              - "https://photos.sevis.store"
              - "https://drive.sevis.store"
              - "https://ebooks.sevis.store"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - X-Folder-Password
              - X-Requested-With
              - Accept
            exposedHeaders:
              - Authorization
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: physics-service
          uri: http://localhost:8099
          predicates:
            - Path=/physics-service/**
          filters:
            - StripPrefix=1
        - id: apparel-api-service
          uri: lb://APPAREL-SERVICE
          predicates:
            - Path=/api/v1/**
        - id: apparel-catalog-service
          uri: lb://APPAREL-SERVICE
          predicates:
            - Path=/catalog-service/**
          filters:
            - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

jwt:
  secret: ${JWT_SECRET:sevis-automobile-transport-secret-key-2024-must-be-at-least-256-bits}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
